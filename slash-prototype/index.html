<style>
*{box-sizing:border-box}body{margin:0;background:#e8e9e3;color:#141414;font:16px Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:22px 5vw;border-bottom:1px solid #c9cbc3}h1{font-size:32px;letter-spacing:-2px;margin:0}header span{font-size:14px}main{min-height:calc(100svh - 85px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;gap:20px}.stage{width:min(94vw,1250px);height:min(68vw,68svh);display:grid;place-items:center;perspective:1800px}.book{height:100%;aspect-ratio:420/297;position:relative;transition:transform 1s;transform-style:preserve-3d;filter:drop-shadow(0 18px 18px #0003)}.book.wings{transform:scale(.55)}.spread{display:flex;position:absolute;inset:0;background:#f8f8f5}.page{width:50%;height:100%;object-fit:contain;background:white}.spine{position:absolute;left:48%;width:4%;height:100%;background:linear-gradient(90deg,transparent,#0003,transparent);pointer-events:none}.flap{border:0;padding:0;position:absolute;top:0;width:45%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.25,.7,.2,1);background:transparent}.flap.left{left:0;transform-origin:left}.flap.right{right:0;transform-origin:right}.face{position:absolute;inset:0;backface-visibility:hidden;background:#b7e51b;display:grid;place-items:center;overflow:hidden}.left .face{clip-path:polygon(0 0,100% 0,83% 100%,0 100%)}.right .face{clip-path:polygon(17% 0,100% 0,100% 100%,0 100%)}.face b{font-size:clamp(16px,4vw,58px);letter-spacing:-2px}.back{transform:rotateY(180deg);background:#0b0b0b}.back img{width:100%;height:100%;object-fit:fill}.left.open{transform:rotateY(-180deg)}.right.open{transform:rotateY(180deg)}.cover{position:absolute;inset:0 0 0 50%;width:50%;height:100%;padding:0;border:0;background:#b7e51b;transform-origin:left;transition:transform 1.25s,opacity .2s 1.05s;cursor:pointer;z-index:5;box-shadow:3px 0 5px #0002}.cover img{width:100%;height:100%}.closed .spread,.closed .flap,.closed .spine{visibility:hidden}.closed{transform:translateX(-25%)}.cover.open{transform:rotateY(-180deg);opacity:0;pointer-events:none}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;max-width:900px}button,select{font:inherit;color:inherit;border:1px solid #a9ada1;background:transparent;border-radius:0;padding:11px 15px;cursor:pointer}button:hover,button:focus-visible{background:#b7e51b}button:disabled{opacity:.3;cursor:default}.hint{margin:0;text-align:center;color:#555;font-size:14px;min-height:18px}.turn{position:absolute;top:0;width:50%;height:100%;z-index:4;transform-style:preserve-3d;pointer-events:none}.turn.forward{right:0;transform-origin:left;animation:forward .85s ease-in-out forwards}.turn.backward{left:0;transform-origin:right;animation:backward .85s ease-in-out forwards}.turn img{position:absolute;width:100%;height:100%;backface-visibility:hidden}.turn img:last-child{transform:rotateY(180deg)}@keyframes forward{to{transform:rotateY(-180deg)}}@keyframes backward{to{transform:rotateY(180deg)}}.zoom .stage{height:auto;min-height:68svh;overflow:auto;display:block}.zoom .book{height:auto;width:1400px;margin:auto}.zoom main{justify-content:flex-start}@media(max-width:600px){header{padding:16px}header span{font-size:12px}.stage{height:66vw}.controls{gap:6px}button,select{font-size:14px;padding:10px}.face b{letter-spacing:-1px}.book.wings{transform:scale(.53)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}

/* Keep the die-cut surfaces transparent outside their polygon, including hover. */
.flap:hover,.flap:focus-visible{background:transparent;border:0}
.flap:focus-visible .face{outline:3px solid #141414;outline-offset:-5px}
.book.closed{aspect-ratio:210/297;transform:none}
.closed .cover{inset:0;width:100%;aspect-ratio:210/297}
.magazine-closed .stage{height:min(125vw,68svh)}
.magazine-closed .spread,.magazine-closed .spine{display:none}
.cover.rear{transform:rotateY(180deg)}
.cover.rear img{transform:rotateY(180deg)}
#reverse[hidden]{display:none}

/* Two explicit surfaces keep the opening sequence independent of page layout. */
.closed-cover{height:100%;aspect-ratio:210/297;max-width:100%;padding:0;border:0;background:#b7e51b;box-shadow:0 18px 30px #0003;cursor:pointer}
.closed-cover img{display:block;width:100%;height:100%;object-fit:contain}
.closed-cover:hover,.closed-cover:focus-visible{background:#b7e51b}
.closed-cover:focus-visible{outline:3px solid black;outline-offset:5px}
.magazine-closed .book{display:none}
body:not(.magazine-closed) .closed-cover{display:none}
.book>.cover{display:none}
.magazine-closed #prev,.magazine-closed #next,.magazine-closed #pages,.magazine-closed #middle,.magazine-closed #zoom,#reverse{display:none}

/* The viewport owns the height; the magazine fits the space above the controls. */
html{height:100%;overflow:hidden}
body{height:100vh;height:100dvh;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{padding:12px 4vw}
main,.zoom main{min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-content:stretch;align-items:center;justify-items:center;padding:16px 12px;gap:12px}
.stage,.magazine-closed .stage,.zoom .stage{width:100%;height:100%;min-height:0;min-width:0;display:grid;place-items:center;overflow:visible}
.book,.closed-cover{flex:none;max-width:none;min-width:0;min-height:0}
.controls{max-width:100%;gap:6px}
.hint{line-height:1.3;max-width:100%}
.zoom .stage{overflow:auto;display:block}
.zoom .book{margin:auto}
@media(max-height:500px){header{padding:6px 16px}h1{font-size:26px}main,.zoom main{padding:8px;gap:6px}.controls button,.controls select{padding:7px 10px}.hint{font-size:12px}}

.turn img{inset:0;display:block;object-fit:contain;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.book{perspective:1800px}

/* A stationary overlay stays above the animated paper throughout each turn. */
.stage{position:relative}
.book>.spine{display:none}
.spine-overlay{position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;background:linear-gradient(90deg,transparent,#0003,transparent);transform:translate(-50%,-50%);transition:transform 1s}
.magazine-closed .spine-overlay{display:none}

/* A solid dark seam masks the light meeting edges of the page images. */
.spine-overlay{background:linear-gradient(90deg,transparent,rgba(0,0,0,.2),transparent)}
.spine-overlay::after{content:none}

/* Page assets already have the A4 ratio; fill avoids fractional letterboxing. */
.page,.turn img{object-fit:fill}
.spread{background:#151515}

/* Open extensions belong to the cover, independently of the current paper spread. */
.book.wings{transform:none}
.left .back{clip-path:polygon(0 0,100% 0,100% 100%,17% 100%)}
.right .back{clip-path:polygon(0 0,83% 0,100% 100%,0 100%)}
.flap{z-index:2}
.flap:disabled{opacity:1}

.page{display:block;flex:0 0 50%;min-width:0}

.page[role="button"]{cursor:pointer}
.page[role="button"]:focus-visible{outline:2px solid #444;outline-offset:-3px}

/* Original wordmark: complete glyphs and narrow margins, as on the printed cover. */
.closed-cover{position:relative;overflow:hidden}
.closed-cover img.front-wordmark{position:absolute;left:1%;top:1%;width:98%;height:auto;mix-blend-mode:multiply}

header h1{margin:0;line-height:0}
.header-logo{display:block;width:108px;height:auto;mix-blend-mode:multiply}
@media(max-height:500px){.header-logo{width:80px}}

/* Interface styling follows the supplied portfolio reference. */
:root{--ui-purple:#ad7aff;--ui-ink:#181818;--ui-paper:#f6f6f3;--ui-lime:#e6f4aa;--ui-font:"SFMono-Regular",Consolas,"Liberation Mono",monospace}

.controls{gap:10px;padding:2px;align-items:center}
.controls button,.controls select{min-height:42px;padding:10px 20px;border:2px solid var(--ui-purple);border-radius:999px;background:var(--ui-paper);color:#8550d2;font-family:var(--ui-font);font-size:14px;font-weight:400;line-height:1.2;letter-spacing:.09em;text-transform:uppercase;transition:background .15s,color .15s,border-color .15s}
.controls select{padding-right:30px;max-width:100%}
.controls button:hover:not(:disabled){background:var(--ui-purple);color:var(--ui-ink)}
.controls button:focus-visible,.controls select:focus-visible{outline:2px solid var(--ui-ink);outline-offset:3px;background:var(--ui-lime)}
.controls button:disabled{opacity:.35;cursor:default}
.controls #start{border-color:var(--ui-ink);color:var(--ui-ink);background:transparent}
.controls #start:hover:not(:disabled){background:var(--ui-lime)}
.hint{font-size:12px;letter-spacing:.025em;color:#56564d}
@media(max-width:600px),(max-height:500px){.controls{gap:6px}.controls button,.controls select{min-height:36px;padding:8px 12px;font-size:12px;letter-spacing:.06em}.controls select{padding-right:24px}header span{font-size:12px}}

/* haco.studio: interface-only design tokens. */
@font-face{font-family:"Space Mono";src:url("assets/fonts/SpaceMono-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"DM Sans";src:url("assets/fonts/DMSans.ttf") format("truetype");font-weight:100 1000;font-style:normal;font-display:swap}
:root{--lime:#DEFF70;--lime-deep:#8AA033;--lav:#CFB5FF;--lav-deep:#7E5FAE;--ice:#B8D8E0;--ice-deep:#5E7F89;--violet:#AD81FD;--cream:#F5F5F0;--ink:#111111;--ui-purple:var(--violet);--ui-ink:var(--ink);--ui-paper:var(--cream);--ui-lime:var(--lime);--ui-font:"Space Mono",monospace}

.controls button:hover:not(:disabled){background:var(--violet);color:var(--ink)}

/* Filled button states invert their outline treatment using the cream text. */
.controls button:hover:not(:disabled),
.controls button:active:not(:disabled),
.controls button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--cream)}

.controls #start:active:not(:disabled),

<body class="magazine-closed"><header><h1><img class="header-logo" src="assets/front-wordmark.png" alt="slash"></h1><span>BERLIN / BOGOTÁ · FEBRUAR 2026</span></header>
<main><div class="stage"><button class="closed-cover" id="closedCover" aria-label="Magazin zur Mitte öffnen"><img class="front-wordmark" src="assets/front-wordmark.png" alt="slash – geschlossene Vorderseite im A4-Hochformat"></button><div class="book closed" id="book"><div class="spread"><img class="page" id="leftPage" alt=""><img class="page" id="rightPage" alt=""></div><div class="spine"></div><button class="flap left" id="leftFlap" aria-label="Berlin-Lasche öffnen" aria-expanded="false"><span class="face"><b>Berlin</b></span><span class="face back"><img src="assets/flap-left.jpg" alt="Berlin Stadtinformationen"></span></button><button class="flap right" id="rightFlap" aria-label="Bogotá-Lasche öffnen" aria-expanded="false"><span class="face"><b>Bogotá</b></span><span class="face back"><img src="assets/flap-right.jpg" alt="Bogotá Stadtinformationen"></span></button><button class="cover" id="cover" aria-label="Magazin öffnen"><img src="assets/cover.jpg" alt="slash Umschlag"></button></div><div class="spine-overlay" id="spineOverlay" aria-hidden="true"></div></div>
<div class="controls"><button id="start">Magazin öffnen</button><button id="reverse">Rückseite ansehen</button><button id="prev" disabled>Zurück</button><select id="pages" aria-label="Doppelseite auswählen"></select><button id="next" disabled>Weiter</button><button id="middle">Zur Mitte</button><button id="zoom">Vergrößern</button></div><p class="hint" id="hint" aria-live="polite">Den Umschlag anklicken, um das Magazin zu öffnen.</p></main>
<script>
const $=id=>document.getElementById(id),book=$('book');let spread=34,opened=false,busy=false,rear=false;const src=n=>n===0?'assets/inside-left.jpg':n===69?'assets/inside-right.jpg':`assets/page-${String(n).padStart(2,'0')}.jpg`;
const groups=[0,...Array.from({length:33},(_,i)=>(i+1)*2),68];for(const n of groups){const option=new Option(n===0?'Umschlag innen / Seite 1':n===68?'Seite 68 / Umschlag innen':`Seiten ${n} / ${n+1}`,n);$('pages').add(option)}
function fitMagazine(){
 const stage=document.querySelector('.stage');
 if(!stage)return;
 const width=Math.max(0,stage.clientWidth-24),height=Math.max(0,stage.clientHeight-24);
 const ratio=opened?420/297:210/297;
 const extent=opened&&($('leftFlap').classList.contains('open')||$('rightFlap').classList.contains('open'))?1.9:1;
 const fittedHeight=Math.min(height,width/(ratio*extent));
 const dpr=window.devicePixelRatio||1;
 const fittedWidth=Math.floor(fittedHeight*ratio*dpr/2)*2/dpr;
 const alignedHeight=Math.floor(fittedHeight*dpr)/dpr;
 const target=opened?book:$('closedCover');
 target.style.width=`${fittedWidth}px`;
 target.style.height=`${alignedHeight}px`;
 const shadow=$('spineOverlay');
 shadow.style.setProperty('--seam-width',`${1/(window.devicePixelRatio||1)}px`);
 shadow.style.width=`${fittedWidth*.04}px`;
 shadow.style.height=`${alignedHeight}px`;
 const scale=1;
 shadow.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
function render(){for(const [id,n] of [['leftPage',spread],['rightPage',spread+1]]){const img=$(id);img.style.visibility=n<0||n>69?'hidden':'visible';if(n>=0&&n<=69){img.src=src(n);img.alt=n===0?'Umschlaginnenseite links':n===69?'Umschlaginnenseite rechts':`Magazinseite ${n}`}}$('reverse').hidden=opened;$('pages').disabled=!opened||busy;$('middle').disabled=busy;$('start').disabled=busy;$('pages').value=spread;$('prev').disabled=!opened||spread===0||busy;$('next').disabled=!opened||spread===68||busy;const center=opened&&spread===34;for(const id of ['leftFlap','rightFlap']){$(id).style.display=opened?'block':'none';$(id).disabled=busy;}book.classList.toggle('wings',opened&&($('leftFlap').classList.contains('open')||$('rightFlap').classList.contains('open')));fitMagazine();$('hint').textContent=!opened?'Den Umschlag anklicken, um das Magazin zu öffnen.':center?'Berlin und Bogotá anklicken, um die Laschen aufzuklappen.':'Links klicken: zurück. Rechts klicken: weiter. Auch mit Pfeiltasten oder Wischen.'}
function openBook(){spread=34;for(const id of ['leftFlap','rightFlap']){ $(id).classList.remove('open');$(id).setAttribute('aria-expanded','false');}rear=false;$('cover').classList.remove('rear');$('cover').querySelector('img').src='assets/cover.jpg';$('reverse').textContent='Rückseite ansehen';document.body.classList.remove('magazine-closed');opened=true;book.classList.remove('closed');$('cover').classList.add('open');$('start').textContent='Schließen';render()}
$('closedCover').onclick=openBook;$('cover').onclick=openBook;$('start').onclick=()=>{if(!opened){openBook();return}opened=false;rear=false;document.body.classList.remove('zoom');$('zoom').textContent='Vergrößern';document.body.classList.add('magazine-closed');$('cover').classList.remove('rear');$('cover').querySelector('img').src='assets/cover.jpg';$('reverse').textContent='Rückseite ansehen';spread=34;book.classList.add('closed');$('cover').classList.remove('open');for(const id of ['leftFlap','rightFlap'])$(id).classList.remove('open');$('start').textContent='Magazin öffnen';render()};
$('reverse').onclick=()=>{rear=!rear;$('cover').classList.toggle('rear',rear);const img=$('cover').querySelector('img');img.src=rear?'assets/back-cover.jpg':'assets/cover.jpg';img.alt=rear?'slash Rückseite mit Bildlogo':'slash Vorderseite';$('reverse').textContent=rear?'Vorderseite ansehen':'Rückseite ansehen'};
for(const [id,label] of [['leftFlap','Berlin'],['rightFlap','Bogotá']])$(id).onclick=()=>{if(busy)return;if(spread!==34){spread=34;render();}const isOpen=$(id).classList.toggle('open');$(id).setAttribute('aria-expanded',isOpen);$(id).setAttribute('aria-label',`${label}-Lasche ${isOpen?'schließen':'öffnen'}`);render()};
async function go(target,animate=true){
 if(busy)return;
 target=Math.max(0,Math.min(68,target));
 if(!opened)openBook();
 if(target===spread)return;
 const old=spread,forward=target>old;
 for(const id of ['leftFlap','rightFlap']){$(id).classList.add('open');$(id).setAttribute('aria-expanded','true');$(id).setAttribute('aria-label',id==='leftFlap'?'Berlin-Klappe schließen':'Bogotá-Klappe schließen');}
 if(!animate){spread=target;render();return}
 busy=true;render();
 const turn=document.createElement('div');
 turn.className=`turn ${forward?'forward':'backward'}`;
 const loads=[];
 for(const n of (forward?[old+1,target]:[old,target+1])){
  const img=document.createElement('img');
  if(n>=0&&n<=69){img.src=src(n);loads.push(img.decode())}
  img.alt='';turn.append(img);
 }
 const underneath=forward?target+1:target;
 if(underneath>=0&&underneath<=69){const preload=new Image();preload.src=src(underneath);loads.push(preload.decode())}
 try{await Promise.all(loads)}catch{busy=false;render();return}
 if(!opened||spread!==old){busy=false;render();return}
 spread=target;render();
 // Keep the receiving side on the old page until the physical sheet covers it.
 const stationary=forward?$('leftPage'):$('rightPage');
 const oldPage=forward?old:old+1;
 stationary.style.visibility=oldPage>=0&&oldPage<=69?'visible':'hidden';
 if(oldPage>=0&&oldPage<=69){stationary.src=src(oldPage);stationary.alt=`Magazinseite ${oldPage}`}
 // Cover extensions remain unfolded and visible during the entire turn.
 fitMagazine();
 book.append(turn);
 let finished=false;
 function finish(){if(finished)return;finished=true;turn.remove();busy=false;render()}
 turn.addEventListener('animationend',finish,{once:true});
 setTimeout(finish,1000);
}
for(const [id,direction,label] of [['leftPage',-2,'Vorherige Doppelseite'],['rightPage',2,'Nächste Doppelseite']]){
 const page=$(id);page.setAttribute('role','button');page.setAttribute('tabindex','0');page.setAttribute('aria-label',label);
 page.onclick=()=>{if(opened&&!busy&&Date.now()>=suppressPageClickUntil)go(spread+direction)};
 page.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();page.onclick()}});
}
$('prev').onclick=()=>go(spread-2);$('next').onclick=()=>go(spread+2);$('middle').onclick=()=>{if(busy)return;spread=34;for(const id of ['leftFlap','rightFlap']){$(id).classList.remove('open');$(id).setAttribute('aria-expanded','false');}render()};$('pages').onchange=e=>go(Number(e.target.value),false);$('zoom').onclick=()=>{const z=document.body.classList.toggle('zoom');$('zoom').textContent=z?'Verkleinern':'Vergrößern';$('zoom').setAttribute('aria-pressed',z)};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(opened&&e.key==='ArrowRight')go(spread+2);if(opened&&e.key==='ArrowLeft')go(spread-2)});let x,suppressPageClickUntil=0;book.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(opened&&Math.abs(d)>60){suppressPageClickUntil=Date.now()+700;go(spread+(d<0?2:-2))}},{passive:true});new ResizeObserver(fitMagazine).observe(document.querySelector('.stage'));window.addEventListener('resize',fitMagazine);window.addEventListener('pageshow',()=>{if(opened)$('start').onclick();});render();
</script></html>

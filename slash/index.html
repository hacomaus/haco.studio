function resetZoom(){stage.style.setProperty('--magazine-zoom','1');stage.style.setProperty('--magazine-x','0px');stage.style.setProperty('--magazine-y','0px');}
function pinchDistance(touches){const dx=touches[0].clientX-touches[1].clientX,dy=touches[0].clientY-touches[1].clientY;return Math.hypot(dx,dy)}
function touchCenter(touches){return{x:(touches[0].clientX+touches[1].clientX)/2,y:(touches[0].clientY+touches[1].clientY)/2}}
function clampPan(x,y,zoom){
 const target=opened?book:$('closedCover'),maxX=Math.max(0,(target.offsetWidth*zoom-stage.clientWidth)/2),maxY=Math.max(0,(target.offsetHeight*zoom-stage.clientHeight)/2);
 return {x:Math.max(-maxX,Math.min(maxX,x)),y:Math.max(-maxY,Math.min(maxY,y))};
}
stage.addEventListener('touchstart',event=>{
 if(event.touches.length!==2)return;
 pinchStartDistance=pinchDistance(event.touches);
 pinchStartZoom=parseFloat(getComputedStyle(stage).getPropertyValue('--magazine-zoom'))||1;
 pinchStartX=parseFloat(getComputedStyle(stage).getPropertyValue('--magazine-x'))||0;
 pinchStartY=parseFloat(getComputedStyle(stage).getPropertyValue('--magazine-y'))||0;
 const center=touchCenter(event.touches);
 pinchStartCenterX=center.x;
 pinchStartCenterY=center.y;
},{passive:true});
stage.addEventListener('touchmove',event=>{
 if(event.touches.length!==2||!pinchStartDistance)return;
 event.preventDefault();
 const zoom=Math.min(2.25,Math.max(1,pinchStartZoom*pinchDistance(event.touches)/pinchStartDistance));
 const center=touchCenter(event.touches),pan=clampPan(pinchStartX+center.x-pinchStartCenterX,pinchStartY+center.y-pinchStartCenterY,zoom);
 stage.style.setProperty('--magazine-zoom',zoom.toFixed(3));
 stage.style.setProperty('--magazine-x',`${pan.x}px`);
 stage.style.setProperty('--magazine-y',`${pan.y}px`);
},{passive:false});
stage.addEventListener('touchend',event=>{if(event.touches.length<2)pinchStartDistance=0},{passive:true});
const groups=[0,...Array.from({length:33},(_,i)=>(i+1)*2),68];for(const n of groups){const option=new Option(n===0?'Umschlag innen / Seite 1':n===68?'Seite 68 / Umschlag innen':`Seiten ${n} / ${n+1}`,n);$('pages').add(option)}
function fitPageSelect(){
 const select=$('pages'),option=select.options[select.selectedIndex];
 if(!option)return;
 const style=getComputedStyle(select),canvas=fitPageSelect.canvas||document.createElement('canvas'),context=canvas.getContext('2d');
 fitPageSelect.canvas=canvas;
 context.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
 const padding=parseFloat(style.paddingLeft)+parseFloat(style.paddingRight)+parseFloat(style.borderLeftWidth)+parseFloat(style.borderRightWidth);
 const arrow=style.appearance==='none'?0:0;
 select.style.width=`${Math.ceil(context.measureText(option.text).width+padding+arrow)}px`;
}
function fitMagazine(){
 const stage=document.querySelector('.stage');
 if(!stage)return;
 const inset=window.matchMedia('(max-width: 720px)').matches?4:24;
 const width=Math.max(0,stage.clientWidth-inset),height=Math.max(0,stage.clientHeight-inset);
 const ratio=opened?420/297:210/297;
 const extent=opened&&($('leftFlap').classList.contains('open')||$('rightFlap').classList.contains('open'))?1.9:1;
 const fittedHeight=Math.min(height,width/(ratio*extent));
 const dpr=window.devicePixelRatio||1;
 const fittedWidth=Math.floor(fittedHeight*ratio*dpr/2)*2/dpr;
 const alignedHeight=Math.floor(fittedHeight*dpr)/dpr;
 const target=opened?book:$('closedCover');
 target.style.width=`${fittedWidth}px`;
 target.style.height=`${alignedHeight}px`;
 const shadow=$('spineOverlay');
 shadow.style.setProperty('--seam-width',`${1/(window.devicePixelRatio||1)}px`);
 shadow.style.width=`${fittedWidth*.04}px`;
 shadow.style.height=`${alignedHeight}px`;
 const scale=1;
 shadow.style.transform=`translate(calc(-50% + var(--magazine-x,0px)),calc(-50% + var(--magazine-y,0px))) scale(var(--magazine-zoom,${scale}))`;
}
function render(){for(const [id,n] of [['leftPage',spread],['rightPage',spread+1]]){const img=$(id);img.style.visibility=n<0||n>69?'hidden':'visible';if(n>=0&&n<=69){img.src=src(n);img.alt=n===0?'Umschlaginnenseite links':n===69?'Umschlaginnenseite rechts':`Magazinseite ${n}`}}$('reverse').hidden=opened;$('pages').disabled=!opened||busy;$('middle').disabled=busy;$('start').disabled=busy;$('pages').value=spread;fitPageSelect();$('prev').disabled=!opened||spread===0||busy;$('next').disabled=!opened||spread===68||busy;const center=opened&&spread===34;for(const id of ['leftFlap','rightFlap']){$(id).style.display=opened?'block':'none';$(id).disabled=busy;}book.classList.toggle('wings',opened&&($('leftFlap').classList.contains('open')||$('rightFlap').classList.contains('open')));fitMagazine();$('hint').innerHTML=!opened?'Den Umschlag anklicken,<span class="mobile-break"><br></span> um das Magazin zu öffnen.':center?'Berlin und Bogotá anklicken,<span class="mobile-break"><br></span> um die Laschen aufzuklappen.':'Links klicken: zurück. Rechts klicken: weiter. Auch mit Pfeiltasten.'}
function openBook(){resetZoom();spread=34;for(const id of ['leftFlap','rightFlap']){ $(id).classList.remove('open');$(id).setAttribute('aria-expanded','false');}rear=false;$('cover').classList.remove('rear');$('cover').querySelector('img').src='assets/cover.jpg';$('reverse').textContent='Rückseite ansehen';document.body.classList.remove('magazine-closed');opened=true;book.classList.remove('closed');$('cover').classList.add('open');$('start').textContent='Schließen';render()}
$('closedCover').onclick=openBook;$('cover').onclick=openBook;$('start').onclick=()=>{if(!opened){openBook();return}resetZoom();opened=false;rear=false;document.body.classList.add('magazine-closed');$('cover').classList.remove('rear');$('cover').querySelector('img').src='assets/cover.jpg';$('reverse').textContent='Rückseite ansehen';spread=34;book.classList.add('closed');$('cover').classList.remove('open');for(const id of ['leftFlap','rightFlap'])$(id).classList.remove('open');$('start').textContent='Magazin öffnen';render()};
$('reverse').onclick=()=>{rear=!rear;$('cover').classList.toggle('rear',rear);const img=$('cover').querySelector('img');img.src=rear?'assets/back-cover.jpg':'assets/cover.jpg';img.alt=rear?'slash Rückseite mit Bildlogo':'slash Vorderseite';$('reverse').textContent=rear?'Vorderseite ansehen':'Rückseite ansehen'};
for(const [id,label] of [['leftFlap','Berlin'],['rightFlap','Bogotá']])$(id).onclick=()=>{if(busy)return;if(spread!==34){spread=34;render();}const isOpen=$(id).classList.toggle('open');$(id).setAttribute('aria-expanded',isOpen);$(id).setAttribute('aria-label',`${label}-Lasche ${isOpen?'schließen':'öffnen'}`);render()};
async function go(target,animate=true){
 if(busy)return;
 target=Math.max(0,Math.min(68,target));
 if(!opened)openBook();
 if(target===spread)return;
 const old=spread,forward=target>old;
 for(const id of ['leftFlap','rightFlap']){$(id).classList.add('open');$(id).setAttribute('aria-expanded','true');$(id).setAttribute('aria-label',id==='leftFlap'?'Berlin-Klappe schließen':'Bogotá-Klappe schließen');}
 if(!animate){spread=target;render();return}
 busy=true;render();
 const turn=document.createElement('div');
 turn.className=`turn ${forward?'forward':'backward'}`;
 const loads=[];
 const waitForImage=image=>new Promise((resolve,reject)=>{
  if(image.complete){if(image.naturalWidth>0)resolve();else reject(new Error(`Bild konnte nicht geladen werden: ${image.src}`));return}
  image.addEventListener('load',resolve,{once:true});
  image.addEventListener('error',()=>reject(new Error(`Bild konnte nicht geladen werden: ${image.src}`)),{once:true});
 });
 for(const n of (forward?[old+1,target]:[old,target+1])){
  const img=document.createElement('img');
  if(n>=0&&n<=69){img.src=src(n);loads.push(waitForImage(img))}
  img.alt='';turn.append(img);
 }
 const underneath=forward?target+1:target;
 if(underneath>=0&&underneath<=69){const preload=new Image();preload.src=src(underneath);loads.push(waitForImage(preload))}
 try{await Promise.all(loads)}catch{busy=false;render();return}
 if(!opened||spread!==old){busy=false;render();return}
 spread=target;render();
 // Keep the receiving side on the old page until the physical sheet covers it.
 const stationary=forward?$('leftPage'):$('rightPage');
 const oldPage=forward?old:old+1;
 stationary.style.visibility=oldPage>=0&&oldPage<=69?'visible':'hidden';
 if(oldPage>=0&&oldPage<=69){stationary.src=src(oldPage);stationary.alt=`Magazinseite ${oldPage}`}
 // Cover extensions remain unfolded and visible during the entire turn.
 fitMagazine();
 book.append(turn);
 let finished=false;
 function finish(){if(finished)return;finished=true;turn.remove();busy=false;render()}
 turn.addEventListener('animationend',finish,{once:true});
 setTimeout(finish,1000);
}
for(const [id,direction,label] of [['leftPage',-2,'Vorherige Doppelseite'],['rightPage',2,'Nächste Doppelseite']]){
 const page=$(id);page.setAttribute('role','button');page.setAttribute('tabindex','0');page.setAttribute('aria-label',label);
 page.onclick=()=>{if(opened&&!busy)go(spread+direction)};
 page.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();page.onclick()}});
}
$('prev').onclick=()=>go(spread-2);$('next').onclick=()=>go(spread+2);$('middle').onclick=()=>{if(busy)return;spread=34;for(const id of ['leftFlap','rightFlap']){$(id).classList.remove('open');$(id).setAttribute('aria-expanded','false');}render()};$('pages').onchange=e=>go(Number(e.target.value),false);document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(opened&&e.key==='ArrowRight')go(spread+2);if(opened&&e.key==='ArrowLeft')go(spread-2)});new ResizeObserver(fitMagazine).observe(document.querySelector('.stage'));window.addEventListener('resize',()=>{fitMagazine();fitPageSelect()});window.addEventListener('pageshow',()=>{if(opened)$('start').onclick();});document.fonts?.ready.then(fitPageSelect);render();
</script></html>
